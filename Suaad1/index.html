    <script>
        // List of all YouTube video IDs on the page
        const youtubeIds = ['mwHAlj0dUt0', '-VUQ7GpSugg', '1JOlmuuwgb0', '4R-GoISa8oY', 'or3O3V4cWEM'];
        let activeVideoId = null;

        /**
         * Safely loads and plays a YouTube video while stopping any other active video.
         */
        function playVideo(videoId) {
            // If another video is playing, reset its player to the initial thumbnail state
            if (activeVideoId && activeVideoId !== videoId) {
                resetVideoPlayer(activeVideoId);
            }

            activeVideoId = videoId;
            const container = document.getElementById(`player-${videoId}`);

            if (!container) return;

            // Replace player container content with embedded iframe
            // تم تغيير youtube-nocookie إلى youtube العادي وإضافة playsinline و mute لتخطي حظر المتصفحات
            container.outerHTML = `
                <div id="player-${videoId}" class="absolute inset-0 w-full h-full bg-black">
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" 
                        class="w-full h-full border-0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
            `;
        }

        /**
         * Resets a video container back to its cover thumbnail & play button
         */
        function resetVideoPlayer(videoId) {
            const playerElement = document.getElementById(`player-${videoId}`);
            if (!playerElement) return;

            // Find index number for label display
            const index = youtubeIds.indexOf(videoId) + 1;

            playerElement.outerHTML = `
                <div id="player-${videoId}" class="absolute inset-0 flex flex-col justify-between p-4 bg-cover bg-center" style="background-image: url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg');">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/30 transition-all"></div>
                    <span class="relative z-10 text-left text-xs font-medium text-white/90 bg-black/40 backdrop-blur-md px-3 py-1 rounded-full w-max">Short #${index}</span>
                    
                    <div class="relative z-10 flex flex-col items-center gap-3 my-auto">
                        <button onclick="playVideo('${videoId}')" class="w-16 h-16 bg-red-600/90 text-white rounded-full flex items-center justify-center text-2xl shadow-lg transition-all duration-300 transform group-hover:scale-110 hover:bg-red-600">
                            <i class="fas fa-play ml-1"></i>
                        </button>
                    </div>

                    <div class="relative z-10 flex justify-center">
                        <a href="https://youtu.be/${videoId}" target="_blank" class="text-xs text-white/90 bg-black/60 hover:bg-black/80 px-3 py-1.5 rounded-lg backdrop-blur-md transition-all flex items-center gap-1.5">
                            <i class="fab fa-youtube text-red-500"></i> Watch on YouTube
                        </a>
                    </div>
                </div>
            `;
        }
